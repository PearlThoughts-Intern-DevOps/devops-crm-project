apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-crm
  template:
    metadata:
      labels:
        app: twenty-crm
    spec:
      containers:
        - name: twenty-crm
          image: twentycrm/twenty-app-dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2020
