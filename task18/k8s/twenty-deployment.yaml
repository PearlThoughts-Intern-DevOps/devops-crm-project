apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-crm
  namespace: twenty
spec:
  replicas: 1
  selector:
    matchLabels: {app: twenty-crm}
  template:
    metadata:
      labels: {app: twenty-crm}
    spec:
      containers:
      - name: twenty
        image: twentycrm/twenty:latest
        envFrom:
        - secretRef: {name: twenty-secrets}
        env:
        - name: REDIS_URL
          value: redis://twenty-redis:6379
        - name: SERVER_URL
          value: http://localhost:3000
        ports:
        - containerPort: 3000