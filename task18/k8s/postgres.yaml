apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-postgres
  namespace: twenty
spec:
  replicas: 1
  selector:
    matchLabels: {app: twenty-postgres}
  template:
    metadata:
      labels: {app: twenty-postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:16
        envFrom:
        - secretRef: {name: twenty-secrets}
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: twenty-postgres
  namespace: twenty
spec:
  selector: {app: twenty-postgres}
  ports:
  - port: 5432