services:
  twenty:
    image: twentycrm/twenty-app-dev:latest
    container_name: devops-crm-twenty
    environment:
      NODE_ENV: development
      SERVER_URL: http://0.0.0.0:2020
      NODE_PORT: 2020
    ports:
      - "8080:2020"
    volumes:
      - twenty-data:/data
    restart: unless-stopped
    networks:
      - crm-network

volumes:
  twenty-data:

networks:
  crm-network:
    driver: bridge
