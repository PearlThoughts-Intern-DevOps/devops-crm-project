services:
  server:
    image: twentycrm/twenty-app-dev:latest
    container_name: twenty-app-dev-server
    restart: unless-stopped
    ports:
      - "2020:2020"
    volumes:
      - twenty-app-dev-data:/app/data
      - twenty-app-dev-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2020/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: devops-crm-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-crm-app
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      TWENTY_SERVER_URL: http://server:2020

volumes:
  twenty-app-dev-data:
  twenty-app-dev-storage:
