services:

  twenty:
    image: twentycrm/twenty-app-dev:latest
    container_name: twenty-server
    ports:
      - "2020:2020"
    restart: unless-stopped
    environment:
      NODE_PORT: 2020
      SERVER_URL: http://localhost:2020
      STORAGE_TYPE: local
    volumes:
      - twenty-data:/data/postgres
      - twenty-storage:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:2020 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-crm-app
    depends_on:
      twenty:
        condition: service_healthy
    environment:
      TWENTY_API_URL: http://twenty:2020
      TWENTY_API_KEY: ${TWENTY_API_KEY}
    restart: unless-stopped
    ports:
      - "3000:2020"

volumes:
  twenty-data:
  twenty-storage:
