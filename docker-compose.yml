# docker-compose.yml for devops-crm-project
#
# Two services:
#   twenty-crm - the actual CRM, using Twenty's own prebuilt dev image
#                (this is the same image `yarn twenty docker:start` runs)
#   app-dev    - builds my app (src/) and syncs it into twenty-crm,
#                using the twenty-sdk CLI (this is what my Dockerfile runs)

services:
  twenty-crm:
    image: twentycrm/twenty-app-dev:latest
    container_name: twenty-crm
    restart: unless-stopped
    ports:
      - "2020:2020"
    networks:
      - twenty-network
    # NOTE: I couldn't confirm the exact internal data path this image
    # uses for persistent storage (it's Twenty's own prebuilt image, not
    # something I built). Without a volume here, CRM data resets if this
    # container is removed - fine for local dev, not for anything else.
    # Run `docker inspect twenty-crm` (after `docker:start`) to find the
    # real path and mount a volume at it if you need data to persist
    # across `docker compose down`.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2020"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app-dev:
    build: .
    container_name: twenty-app-dev-sync
    depends_on:
      - twenty-crm
    environment:
      TWENTY_URL: http://twenty-crm:2020
      TWENTY_API_KEY: ${TWENTY_API_KEY}
    volumes:
      # mount source code so file changes on the host are picked up
      # without rebuilding the image every time
      - ./src:/app/src
    networks:
      - twenty-network

networks:
  twenty-network: