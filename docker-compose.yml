name: devops-crm-project

services:
  twenty-crm:
    image: twentycrm/twenty:v2.35.0
    container_name: twenty_crm_app
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-cache:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgres://postgres:postgres@twenty-db:5432/default
      REDIS_URL: redis://twenty-cache:6379
      SERVER_URL: http://localhost:3000
      PORT: "3000"
      NODE_PORT: "3000"
      APP_SECRET: "KDYeCPUQ5pmL/BWMC9jhYtVNXNHCMhiXa8EvrC3SG5Y="
      ENCRYPTION_KEY: "/NPeUsqXeXOxYPZB1iQZSTACRvUkfAJbggbtGCUR9CY="
      STORAGE_TYPE: local
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      DISABLE_DB_MIGRATIONS: "false"
    ports:
      - "3000:3000"
    networks:
      - crm-network
    restart: unless-stopped

  twenty-db:
    image: postgres:16-alpine
    container_name: twenty_crm_db
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - crm-network
    restart: unless-stopped

  twenty-cache:
    image: redis:7-alpine
    container_name: twenty_crm_cache
    command:
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crm-network
    restart: unless-stopped

networks:
  crm-network:
    driver: bridge

volumes:
  db-data: