services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-crm:task5
    container_name: devops-crm-app
    environment:
      TWENTY_API_URL: http://twenty:2020
    depends_on:
      - twenty
    networks:
      - crm-network

  twenty:
    image: twentycrm/twenty-app-dev:latest
    container_name: devops-crm-twenty
    environment:
      NODE_ENV: development
    ports:
      - "8090:2020"
    volumes:
      - twenty-data:/data
    restart: unless-stopped
    networks:
      - crm-network

volumes:
  twenty-data:

networks:
  crm-network:
    driver: bridge
