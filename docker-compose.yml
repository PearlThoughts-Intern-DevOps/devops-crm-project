name: twenty-task5

services:

  server:
    image: twentycrm/twenty:${TAG:-v2.35.0}
    container_name: twenty-task5-server

    ports:
      - "2020:3000"

    environment:
      NODE_PORT: ${NODE_PORT}
      SERVER_URL: ${SERVER_URL}

      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST}:${PG_DATABASE_PORT}/${PG_DATABASE_NAME}

      REDIS_URL: ${REDIS_URL}

      STORAGE_TYPE: ${STORAGE_TYPE}

      APP_SECRET: ${APP_SECRET}

      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}

    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:3000/healthz"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

    networks:
      - twenty-network


  worker:
    image: twentycrm/twenty:${TAG:-v2.35.0}
    container_name: twenty-task5-worker

    command:
      - yarn
      - worker:prod

    environment:
      SERVER_URL: ${SERVER_URL}

      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST}:${PG_DATABASE_PORT}/${PG_DATABASE_NAME}

      REDIS_URL: ${REDIS_URL}

      STORAGE_TYPE: ${STORAGE_TYPE}

      APP_SECRET: ${APP_SECRET}

      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"

    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage

    depends_on:
      server:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - twenty-network


  db:
    image: postgres:16
    container_name: twenty-task5-db

    environment:
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE_NAME}

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_DATABASE_USER} -d ${PG_DATABASE_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - twenty-network


  redis:
    image: redis:7

    container_name: twenty-task5-redis

    command:
      - "--maxmemory-policy"
      - "noeviction"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - redis-data:/data

    restart: unless-stopped

    networks:
      - twenty-network


volumes:
  db-data:
  server-local-data:
  redis-data:


networks:
  twenty-network:
    driver: bridge
