apiVersion: v1
kind: Secret
metadata:
  name: twenty-crm-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: twenty-db-password
  ENCRYPTION_KEY: twenty-local-encryption-key-1234567890

---
apiVersion: v1
kind: Service
metadata:
  name: twenty-db
spec:
  selector:
    app: twenty-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-db
  template:
    metadata:
      labels:
        app: twenty-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: default
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twenty-crm-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d default
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: twenty-redis
spec:
  selector:
    app: twenty-redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-redis
  template:
    metadata:
      labels:
        app: twenty-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --maxmemory-policy
            - noeviction
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-crm
  template:
    metadata:
      labels:
        app: twenty-crm
    spec:
      containers:
        - name: twenty-server
          image: twentycrm/twenty:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_PORT
              value: "3000"
            - name: SERVER_URL
              value: "http://localhost:30080"
            - name: PG_DATABASE_URL
              value: "postgres://postgres:twenty-db-password@twenty-db:5432/default"
            - name: REDIS_URL
              value: "redis://twenty-redis:6379"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-crm-secrets
                  key: ENCRYPTION_KEY
            - name: STORAGE_TYPE
              value: "local"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: twenty-crm
spec:
  type: NodePort
  selector:
    app: twenty-crm
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
