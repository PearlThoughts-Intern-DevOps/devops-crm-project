apiVersion: apps/v1
kind: Deployment

metadata:
  name: twenty-crm
  labels:
    app: twenty-crm

spec:
  replicas: 1

  selector:
    matchLabels:
      app: twenty-crm

  template:
    metadata:
      labels:
        app: twenty-crm

    spec:
      containers:
        - name: twenty-crm
          image: twenty-crm:task18
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 2020
              protocol: TCP

          env:
            - name: NODE_PORT
              value: "2020"
            - name: SERVER_URL
              value: "http://localhost:2020"