apiVersion: apps/v1

kind: Deployment

metadata:
  name: twenty-crm

spec:
  replicas: 1

  selector:
    matchLabels:
      app: twenty-crm

  template:
    metadata:
      labels:
        app: twenty-crm

    spec:
      containers:
        - name: twenty-crm
          image: twentycrm/twenty-app-dev:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 2020
          env:
            - name: PORT
              value: "2020"

            - name: SERVER_URL
              value: "http://localhost:2020"

            - name: NODE_ENV
              value: "development"

            - name: STORAGE_TYPE
              value: "local"

            - name: APPLICATION_LOG_DRIVER
              value: "CONSOLE"