---
# ── Package Management ─────────────────────────────────────
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Install common system packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# ── System Configuration ───────────────────────────────────
- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Ensure /opt directory exists
  ansible.builtin.file:
    path: /opt
    state: directory
    owner: root
    group: root
    mode: "0755"

# ── Swap Configuration ─────────────────────────────────────
- name: Check if swap file already exists
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create 3GB swap file
  ansible.builtin.command:
    cmd: fallocate -l 3G /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when: not swapfile_stat.stat.exists

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Enable swap
  ansible.builtin.command:
    cmd: swapon /swapfile
  when:
    - not swapfile_stat.stat.exists
    - ansible_swapfree_mb < 1
  changed_when: true

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present

- name: Set swappiness to 10
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: true
