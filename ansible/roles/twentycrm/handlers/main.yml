---
- name: Restart Twenty CRM
  ansible.builtin.command:
    cmd: docker compose --env-file .env up -d --force-recreate
    chdir: "{{ app_dir }}"
  become_user: ubuntu
  register: restart_result
  changed_when: true

- name: Show restart output
  ansible.builtin.debug:
    msg: "{{ restart_result.stdout_lines }}"
  listen: Restart Twenty CRM
