---
- name: Deploy Twenty CRM
  hosts: twenty_crm
  become: true
  gather_facts: true

  handlers:
    - name: restart twenty crm
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/packages/twenty-docker"
        state: restarted

  tasks:

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - python3-docker
          - python3-requests
        state: present
        update_cache: false

    - name: Create Docker keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Create dedicated application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        home: "{{ app_home }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Add application user to docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0750'

    - name: Create Docker data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0750'
      loop:
        - "{{ app_home }}/.docker-data"
        - "{{ app_home }}/.docker-data/postgres"
        - "{{ app_home }}/.docker-data/server-local-data"

    - name: Clone Twenty CRM repository
      ansible.builtin.git:
        repo: "{{ twenty_repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ twenty_repo_version }}"
        force: false
      become_user: "{{ app_user }}"

    - name: Render Twenty CRM environment file
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/packages/twenty-docker/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0640'
      notify: restart twenty crm

    - name: Start Twenty CRM Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/packages/twenty-docker"
        state: present
        pull: missing

    - name: Wait for Twenty CRM port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ twenty_app_port }}"
        state: started
        delay: 5
        timeout: 180

    - name: Verify Twenty CRM HTTP endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ twenty_app_port }}"
        status_code:
          - 200
          - 301
          - 302
        return_content: false
      register: http_check
      retries: 12
      delay: 10
      until: http_check.status in [200, 301, 302]

    - name: Show running Twenty CRM containers
      ansible.builtin.command:
        cmd: docker compose ps
      args:
        chdir: "{{ app_dir }}/packages/twenty-docker"
      changed_when: false
      register: ps_output

    - name: Display Twenty CRM verification result
      ansible.builtin.debug:
        msg: |
          Twenty CRM deployment completed successfully.

          Application URL:
          http://127.0.0.1:{{ twenty_app_port }}

          HTTP status:
          {{ http_check.status }}

          Running containers:
          {{ ps_output.stdout }}
