---
- name: Automate Twenty CRM setup with Ansible
  hosts: twenty_crm
  become: true
  vars_files:
    - vars/main.yml

  handlers:
    - name: restart twenty crm
      become: true
      become_user: "{{ app_user }}"
      community.docker.docker_compose_v2:
        project_src: "{{ app_config_dir }}"
        state: restarted

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - python3-pip
        state: present

    - name: Install Docker and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Install Python Docker SDK
      ansible.builtin.pip:
        name:
          - docker
          - requests
        state: present
        extra_args: --break-system-packages

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Create dedicated application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true
        system: true
        state: present

    - name: Create application base directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"
      loop:
        - "{{ app_base_dir }}"
        - "{{ app_config_dir }}"
        - "{{ app_data_dir }}"

    - name: Clone devops-crm-project repository
      become: true
      become_user: "{{ app_user }}"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_repo_dir }}"
        version: "{{ repo_branch }}"
        force: false
      register: repo_clone_result

    - name: Deploy application .env configuration from template
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_config_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
      notify: restart twenty crm

    - name: Deploy docker-compose.yml from template
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ app_config_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
      notify: restart twenty crm

    - name: Start Twenty CRM via Docker Compose
      become: true
      become_user: "{{ app_user }}"
      community.docker.docker_compose_v2:
        project_src: "{{ app_config_dir }}"
        state: present
      register: compose_result

    - name: Wait for Twenty CRM to respond on its port
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ twenty_node_port }}"
        delay: 10
        timeout: 180
        state: started
      delegate_to: "{{ inventory_hostname }}"

    - name: Verify HTTP response from Twenty CRM
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ twenty_node_port }}"
        status_code: 200
        return_content: false
      register: health_check
      retries: 15
      delay: 15
      until: health_check.status == 200
      delegate_to: "{{ inventory_hostname }}"

    - name: Report Twenty CRM deployment status
      ansible.builtin.debug:
        msg: "Twenty CRM is up and responding with HTTP {{ health_check.status }} on port {{ twenty_node_port }}"