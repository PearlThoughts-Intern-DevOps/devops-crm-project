---
- name: Automate Twenty CRM deployment
  hosts: twenty
  become: true

  pre_tasks:
    - name: Verify Twenty API key is provided
      ansible.builtin.assert:
        that:
          - twenty_api_key | length > 0
        fail_msg: "TWENTY_API_KEY environment variable is not set."

  tasks:
    - name: Install required dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create dedicated application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Create dedicated application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups: docker
        append: true
        create_home: true
        shell: /bin/bash
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Create Ansible temporary directory
      ansible.builtin.file:
        path: "/home/{{ app_user }}/.ansible/tmp"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0700"

    - name: Clone Twenty CRM repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        version: "{{ repo_version }}"
        dest: "{{ app_dir }}"
        update: true
        force: false
      become_user: "{{ app_user }}"
      register: repo_result

    - name: Configure Twenty CRM environment
      ansible.builtin.template:
        src: .env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"
      notify: Restart Twenty CRM application

    - name: Configure Docker Compose
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      notify: Restart Twenty CRM application

    - name: Build Twenty CRM application image
      ansible.builtin.command:
        cmd: docker compose build app-deployer
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      when: repo_result.changed

    - name: Start Twenty CRM server
      ansible.builtin.command:
        cmd: docker compose up -d twenty
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Wait for Twenty CRM server to become available
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ twenty_port }}"
        method: GET
        status_code: 200
        return_content: false
      register: twenty_health
      retries: 60
      delay: 5
      until: twenty_health.status == 200

    - name: Run application deployer
      ansible.builtin.command:
        cmd: docker compose up --build app-deployer
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      register: deployer_result
      changed_when: true

    - name: Verify Twenty CRM containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      register: compose_status
      changed_when: false

    - name: Verify Twenty CRM HTTP endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ twenty_port }}"
        method: GET
        status_code: 200
      register: final_health
      changed_when: false

    - name: Display deployment verification
      ansible.builtin.debug:
        msg:
          - "Twenty CRM HTTP status: {{ final_health.status }}"
          - "Docker Compose status:"
          - "{{ compose_status.stdout }}"

  handlers:
    - name: Restart Twenty CRM application
      ansible.builtin.command:
        cmd: docker compose up -d --build twenty
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

