---
- name: Deploy Twenty CRM on AWS EC2
  hosts: twenty
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/twenty-crm
    app_port: 2020
    container_port: 3000
    server_url: "http://{{ ansible_host }}:2020"

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Check swap status
      ansible.builtin.command: swapon --show
      register: swap_status
      changed_when: false

    - name: Create 2 GB swap file
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile
      when: swap_status.stdout == ""

    - name: Set swap file permissions
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Initialize swap file
      ansible.builtin.command: mkswap /swapfile
      when: swap_status.stdout == ""

    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      when: swap_status.stdout == ""

    - name: Persist swap configuration
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - curl
          - openssl
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Twenty CRM application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Generate PostgreSQL password
      ansible.builtin.shell:
        cmd: "openssl rand -hex 32 > {{ app_dir }}/pg_password"
        creates: "{{ app_dir }}/pg_password"
      no_log: true

    - name: Generate Twenty CRM encryption key
      ansible.builtin.shell:
        cmd: "openssl rand -base64 32 > {{ app_dir }}/encryption_key"
        creates: "{{ app_dir }}/encryption_key"
      no_log: true

    - name: Read PostgreSQL password
      ansible.builtin.slurp:
        src: "{{ app_dir }}/pg_password"
      register: pg_password_file
      no_log: true

    - name: Read Twenty encryption key
      ansible.builtin.slurp:
        src: "{{ app_dir }}/encryption_key"
      register: encryption_key_file
      no_log: true

    - name: Set generated secrets
      ansible.builtin.set_fact:
        pg_password: "{{ pg_password_file.content | b64decode | trim }}"
        encryption_key: "{{ encryption_key_file.content | b64decode | trim }}"
      no_log: true

    - name: Create Twenty CRM Docker Compose file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          name: twenty

          services:

            db:
              image: postgres:16
              volumes:
                - db-data:/var/lib/postgresql/data
              environment:
                POSTGRES_DB: default
                POSTGRES_PASSWORD: "{{ pg_password }}"
                POSTGRES_USER: postgres
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d default"]
                interval: 5s
                timeout: 5s
                retries: 10
              restart: unless-stopped

            redis:
              image: redis:7
              command: ["--maxmemory-policy", "noeviction"]
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 5s
                retries: 10
              restart: unless-stopped

            server:
              image: twentycrm/twenty:latest
              volumes:
                - server-local-data:/app/packages/twenty-server/.local-storage
              ports:
                - "{{ app_port }}:{{ container_port }}"
              environment:
                NODE_PORT: 3000
                PG_DATABASE_URL: "postgres://postgres:{{ pg_password }}@db:5432/default"
                SERVER_URL: "{{ server_url }}"
                REDIS_URL: "redis://redis:6379"
                ENCRYPTION_KEY: "{{ encryption_key }}"
                STORAGE_TYPE: "local"
              depends_on:
                db:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              healthcheck:
                test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
                interval: 30s
                timeout: 10s
                retries: 10
                start_period: 60s
              restart: unless-stopped

            worker:
              image: twentycrm/twenty:latest
              volumes:
                - server-local-data:/app/packages/twenty-server/.local-storage
              command: ["yarn", "worker:prod"]
              environment:
                PG_DATABASE_URL: "postgres://postgres:{{ pg_password }}@db:5432/default"
                SERVER_URL: "{{ server_url }}"
                REDIS_URL: "redis://redis:6379"
                DISABLE_DB_MIGRATIONS: "true"
                DISABLE_CRON_JOBS_REGISTRATION: "true"
                ENCRYPTION_KEY: "{{ encryption_key }}"
                STORAGE_TYPE: "local"
              depends_on:
                db:
                  condition: service_healthy
                server:
                  condition: service_healthy
              restart: unless-stopped

          volumes:
            db-data:
            server-local-data:

    - name: Deploy Twenty CRM
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"

    - name: Wait for Twenty CRM health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/healthz"
        method: GET
        status_code: 200
      register: health_check
      retries: 30
      delay: 10
      until: health_check.status == 200

    - name: Display Docker container status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: docker_status
      changed_when: false

    - name: Show Docker status
      ansible.builtin.debug:
        var: docker_status.stdout_lines

    - name: Display Twenty CRM application logs
      ansible.builtin.command:
        cmd: docker compose logs --tail=20 server
        chdir: "{{ app_dir }}"
      register: app_logs
      changed_when: false

    - name: Show Twenty CRM logs
      ansible.builtin.debug:
        var: app_logs.stdout_lines

    - name: Final deployment verification
      ansible.builtin.debug:
        msg: "Twenty CRM is running and healthy at http://{{ ansible_host }}:{{ app_port }}"
