---
- name: Setup Twenty CRM using Ansible
  hosts: twenty
  become: true

  handlers:
    - name: Restart Twenty CRM
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

  tasks:

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - docker
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Clone Twenty CRM repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}/source"
        version: "{{ repo_branch }}"
        update: true
      become_user: "{{ app_user }}"

    - name: Deploy environment configuration
      ansible.builtin.template:
        src: .env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      notify: Restart Twenty CRM

    - name: Deploy Docker Compose configuration
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      notify: Restart Twenty CRM

    - name: Create PostgreSQL data volume
      community.docker.docker_volume:
        name: "{{ postgres_volume }}"
        state: present

    - name: Create application storage volume
      community.docker.docker_volume:
        name: "{{ storage_volume }}"
        state: present

    - name: Check Twenty CRM container status
      ansible.builtin.command:
        cmd: docker compose ps --status running --services
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      register: twenty_running
      changed_when: false

    - name: Start Twenty CRM with Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      when: "'twenty' not in twenty_running.stdout"

    - name: Wait for Twenty CRM HTTP endpoint
      ansible.builtin.uri:
        url: "{{ server_url }}"
        method: GET
        status_code: 200
      register: twenty_health
      retries: 20
      delay: 5
      until: twenty_health.status == 200

    - name: Display Twenty CRM status
      ansible.builtin.debug:
        msg: "Twenty CRM is running successfully at {{ server_url }}"
