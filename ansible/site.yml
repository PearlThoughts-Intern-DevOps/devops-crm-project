---
- name: Deploy Twenty CRM using Ansible
  hosts: twenty
  become: true
  gather_facts: true

  handlers:
    - name: Restart Twenty CRM
      ansible.builtin.command:
        cmd: docker compose -p {{ compose_project_name }} up -d
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

  tasks:

    - name: Install required system dependencies
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ca-certificates
          - python3
          - python3-pip
        state: present
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Create dedicated application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups: docker
        append: true
        create_home: true
        shell: /bin/bash
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Clone Twenty CRM repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}/source"
        version: "{{ repo_version }}"
        update: true
      become: true
      become_user: "{{ app_user }}"
      when: not ansible_check_mode

    - name: Deploy environment configuration
      ansible.builtin.template:
        src: .env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"
      notify: Restart Twenty CRM

    - name: Deploy Docker Compose configuration
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      notify: Restart Twenty CRM

    - name: Start Twenty CRM
      ansible.builtin.command:
        cmd: docker compose -p {{ compose_project_name }} up -d
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stdout or 'Created' in compose_result.stdout or 'Recreated' in compose_result.stdout"

    - name: Wait for Twenty CRM HTTP endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ host_port }}"
        method: GET
        status_code:
          - 200
          - 301
          - 302
          - 307
          - 308
        timeout: 5
      register: twenty_health
      retries: 12
      delay: 5
      until: twenty_health.status in [200, 301, 302, 307, 308]

    - name: Display Twenty CRM verification result
      ansible.builtin.debug:
        msg: "Twenty CRM is running successfully on http://localhost:{{ host_port }}"
