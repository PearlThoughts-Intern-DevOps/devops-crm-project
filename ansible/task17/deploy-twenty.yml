---
- name: Deploy Twenty CRM
  hosts: twenty
  become: true

  vars:
    twenty_dir: /opt/twenty
    twenty_port: 2020
    postgres_password: postgres

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Install Docker and required dependencies
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - python3-docker
          - curl
          - openssl
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Twenty application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ twenty_dir }}"
        - "{{ twenty_dir }}/data"
        - "{{ twenty_dir }}/logs"

    - name: Create Docker network
      ansible.builtin.shell: |
        docker network inspect twenty-net >/dev/null 2>&1 || docker network create twenty-net
      args:
        executable: /bin/bash
      changed_when: false

    - name: Check whether PostgreSQL container exists
      ansible.builtin.command:
        cmd: docker inspect twenty-db
      register: postgres_container
      failed_when: false
      changed_when: false

    - name: Deploy PostgreSQL
      ansible.builtin.command:
        cmd: >
          docker run -d
          --name twenty-db
          --restart always
          --network twenty-net
          -e POSTGRES_USER=postgres
          -e POSTGRES_PASSWORD={{ postgres_password }}
          -e POSTGRES_DB=default
          postgres:16
      when: postgres_container.rc != 0

    - name: Check whether Redis container exists
      ansible.builtin.command:
        cmd: docker inspect twenty-redis
      register: redis_container
      failed_when: false
      changed_when: false

    - name: Deploy Redis
      ansible.builtin.command:
        cmd: >
          docker run -d
          --name twenty-redis
          --restart always
          --network twenty-net
          redis:7
      when: redis_container.rc != 0

    - name: Create Twenty CRM environment file
      ansible.builtin.shell: |
        if [ ! -f "{{ twenty_dir }}/.env" ]; then
          APP_SECRET=$(openssl rand -hex 32)
          cat > "{{ twenty_dir }}/.env" <<ENVFILE
        PG_DATABASE_URL=postgres://postgres:{{ postgres_password }}@twenty-db:5432/default
        REDIS_URL=redis://twenty-redis:6379
        SERVER_URL=http://{{ ansible_host }}:{{ twenty_port }}
        APP_SECRET=${APP_SECRET}
        ENVFILE
          chmod 600 "{{ twenty_dir }}/.env"
        fi
      args:
        executable: /bin/bash
      no_log: true

    - name: Check whether Twenty CRM container exists
      ansible.builtin.command:
        cmd: docker inspect twenty-crm
      register: twenty_container
      failed_when: false
      changed_when: false

    - name: Deploy Twenty CRM
      ansible.builtin.command:
        cmd: >
          docker run -d
          --name twenty-crm
          --restart always
          --network twenty-net
          -p {{ twenty_port }}:3000
          --env-file {{ twenty_dir }}/.env
          --health-cmd="curl -f http://localhost:3000/ || exit 1"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=3
          --health-start-period=60s
          twentycrm/twenty:latest
      when: twenty_container.rc != 0

    - name: Wait for Twenty CRM container to become healthy
      ansible.builtin.shell: |
        docker inspect --format '{{ "{{.State.Health.Status}}" }}' twenty-crm
      args:
        executable: /bin/bash
      register: twenty_health
      until: twenty_health.stdout | trim == "healthy"
      retries: 20
      delay: 15
      changed_when: false

    - name: Verify Twenty CRM HTTP response
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ twenty_port }}"
        method: GET
        status_code: 200
      register: twenty_http
      retries: 5
      delay: 10
      until: twenty_http.status == 200

    - name: Display Docker container status
      ansible.builtin.command:
        cmd: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: docker_status
      changed_when: false

    - name: Show Docker container status
      ansible.builtin.debug:
        var: docker_status.stdout_lines

    - name: Display Twenty CRM application logs
      ansible.builtin.command:
        cmd: docker logs --tail 100 twenty-crm
      register: twenty_logs
      changed_when: false

    - name: Show Twenty CRM application logs
      ansible.builtin.debug:
        var: twenty_logs.stdout_lines

    - name: Display deployment verification
      ansible.builtin.debug:
        msg:
          - "Twenty CRM deployment completed successfully."
          - "Application URL: http://{{ ansible_host }}:{{ twenty_port }}"
          - "HTTP status: {{ twenty_http.status }}"
          - "Container health: {{ twenty_health.stdout | trim }}"
