---
- name: Deploy Twenty CRM to EC2 via Docker
  hosts: twenty_crm
  become: true
  vars:
    app_dir: /opt/twenty-crm
    repo_url: https://github.com/PearlThoughts-Intern-DevOps/devops-crm-project
    repo_branch: fiza-task5
    app_port: 2020

  tasks:
    # 1. Update server packages
    - name: Update apt cache and upgrade all packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install base prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present

    # 2. Install Docker + dependencies
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      apt:
        update_cache: yes
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Reset connection so docker group membership takes effect
      meta: reset_connection

    # Swap: t3.small has only 2GB RAM, image build/first boot needs headroom
    - name: Check if swapfile already exists
      stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 2G swapfile
      command: fallocate -l 2G /swapfile
      when: not swapfile_stat.stat.exists

    - name: Set swapfile permissions
      file:
        path: /swapfile
        mode: "0600"
      when: not swapfile_stat.stat.exists

    - name: Format swapfile
      command: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swapfile
      command: swapon /swapfile
      when: not swapfile_stat.stat.exists

    - name: Persist swapfile in fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    # 3. Application directories
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # 4. Deploy: clone repo
    - name: Clone devops-crm-project repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true
      become_user: ubuntu

    # 5. Configure Twenty CRM environment variables
    - name: Deploy .env file for Twenty CRM
      template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    # 6. Deploy Twenty CRM using Docker
    #    Build first, then start only the server so its healthcheck can be
    #    monitored independently before starting the dependent app service.
    - name: Build Docker images with docker compose
      command: docker compose build
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    - name: Start Twenty CRM server container
      command: docker compose up -d server
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    # 7. Wait for the server container to report healthy
    - name: Wait for the server container to report healthy
      shell: >
        docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' twenty-app-dev-server
      register: health_status
      become_user: ubuntu
      retries: 60
      delay: 15
      until: health_status.stdout == "healthy"

    # 8. Start the remaining application services only after the server is healthy
    - name: Start the remaining Docker Compose services
      command: docker compose up -d
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    # 9. Wait for the app port to accept connections
    - name: Wait for Twenty CRM port to be open
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ app_port }}"
        delay: 10
        timeout: 300
      delegate_to: localhost
      become: false

    # 10. Verify Twenty CRM is running / responding
    - name: Verify Twenty CRM health endpoint responds
      uri:
        url: "http://localhost:{{ app_port }}/healthz"
        status_code: 200
      register: healthz_check
      retries: 5
      delay: 10
      until: healthz_check.status == 200

    # 11. Display container status
    - name: Get docker container status
      command: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      register: container_status

    - name: Show container status
      debug:
        var: container_status.stdout_lines

    # 12. Display application logs
    - name: Get application logs (last 100 lines)
      command: docker compose logs --tail=100
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      register: app_logs

    - name: Show application logs
      debug:
        var: app_logs.stdout_lines
