---
- name: Deploy Twenty CRM with Ansible
  hosts: twenty_crm
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  handlers:
    - name: Restart Twenty CRM
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate twenty
        chdir: "{{ app_dir }}"
      listen: "restart twenty"

  tasks:
    - name: Install required dependencies and Docker
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ca-certificates
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Create dedicated application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Clone Twenty CRM repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        version: "{{ repo_version }}"
        dest: "{{ app_dir }}/source"
        depth: 1
        update: true
        force: false
      become_user: "{{ app_user }}"

    - name: Create Docker Compose configuration from Jinja2 template
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      notify: "restart twenty"

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ app_dir }}"
      changed_when: false

    - name: Start Twenty CRM stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: >
        'Created' in compose_up.stdout or
        'Recreated' in compose_up.stdout or
        'Started' in compose_up.stdout or
        'Pulled' in compose_up.stdout

    - name: Wait for Twenty CRM health endpoint
      ansible.builtin.uri:
        url: "{{ app_url }}/healthz"
        status_code: 200
      register: health_check
      retries: 30
      delay: 5
      until: health_check.status == 200

    - name: Verify Twenty CRM containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Display Twenty CRM status
      ansible.builtin.debug:
        var: compose_status.stdout
