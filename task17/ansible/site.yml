---
- name: Deploy Twenty CRM - Task 17
  hosts: twenty
  become: true

  vars:
    app_user: twenty
    app_dir: /opt/twenty
    twenty_port: 3000

  tasks:

    - name: Update apt cache and install dependencies
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Twenty application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        system: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Deploy environment configuration
      ansible.builtin.template:
        src: .env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      notify: Restart Twenty CRM

    - name: Deploy Docker Compose configuration
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      notify: Restart Twenty CRM

    - name: Start Twenty CRM stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout or 'Recreated' in compose_up.stdout"

    - name: Wait for Twenty CRM
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ twenty_port }}"
        status_code: 200
      register: twenty_health
      retries: 12
      delay: 10
      until: twenty_health.status == 200

    - name: Show Twenty CRM status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Display Twenty CRM status
      ansible.builtin.debug:
        var: compose_status.stdout_lines

  handlers:

    - name: Restart Twenty CRM
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"
