---
- name: Deploy Twenty CRM using Ansible
  hosts: webservers
  become: yes
  vars_files:
    - vars/main.yml

  tasks:
    - name: Update apt cache and install dependencies
      apt:
        update_cache: yes
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present

    - name: Install Docker and Docker Compose
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create dedicated application user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        groups: docker
        append: yes
        state: present

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Clone Twenty CRM repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: "{{ app_user }}"

    - name: Deploy docker-compose.yml from Jinja2 template
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
      notify: Restart Twenty CRM

    - name: Start Twenty CRM with Docker Compose
      command: docker-compose up -d
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Wait for application to be accessible
      uri:
        url: "http://localhost:2020"
        status_code: [200, 301, 302]
        timeout: 60
      register: app_status
      ignore_errors: yes

    - name: Display application status
      debug:
        msg: "Twenty CRM is running! HTTP Status: {{ app_status.status | default('Pending') }}"

  handlers:
    - name: Restart Twenty CRM
      command: docker-compose up -d
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
