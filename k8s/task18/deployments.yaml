apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-db
  labels:
    app: twenty-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-db
  template:
    metadata:
      labels:
        app: twenty-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: twenty

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-redis
  labels:
    app: twenty-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-redis
  template:
    metadata:
      labels:
        app: twenty-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-crm
  labels:
    app: twenty-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-crm
  template:
    metadata:
      labels:
        app: twenty-crm
    spec:
      containers:
        - name: twenty
          image: twentycrm/twenty:latest
          ports:
            - containerPort: 3000
          env:
            - name: PG_DATABASE_URL
              value: postgresql://postgres:postgres@twenty-db:5432/twenty
            - name: REDIS_URL
              value: redis://twenty-redis:6379
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: APP_SECRET
            - name: SERVER_URL
              value: http://localhost:3020
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
