apiVersion: v1
kind: Service
metadata:
  name: twenty-db
spec:
  selector:
    app: twenty-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: twenty-redis
spec:
  selector:
    app: twenty-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: twenty-crm
spec:
  selector:
    app: twenty-crm
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
  type: NodePort