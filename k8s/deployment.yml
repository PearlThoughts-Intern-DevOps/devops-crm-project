apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: "twenty"
            - name: POSTGRES_USER
              value: "twenty"
            - name: POSTGRES_PASSWORD
              value: "twenty"
          ports:
            - containerPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-crm
  labels:
    app: twenty-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-crm
  template:
    metadata:
      labels:
        app: twenty-crm
    spec:
      containers:
        - name: twenty-crm
          image: twentycrm/twenty:latest
          ports:
            - containerPort: 3000
          env:
            - name: PG_DATABASE_URL
              value: "postgres://twenty:twenty@postgres-service:5432/twenty"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
            - name: APP_SECRET
              value: "my-secret-key-for-twenty-crm"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
