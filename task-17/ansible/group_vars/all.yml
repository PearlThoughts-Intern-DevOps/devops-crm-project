---
twenty_app_dir: /opt/twenty
twenty_app_user: ec2-user
twenty_app_group: ec2-user

twenty_port: 2020
twenty_version: v2.38.1
twenty_image: "twentycrm/twenty:{{ twenty_version }}"
twenty_server_url: "http://{{ inventory_hostname }}:{{ twenty_port }}"

postgres_image: postgres:16-alpine
postgres_database: default
postgres_user: postgres
redis_image: redis:7-alpine

docker_compose_version: v5.5.1
docker_compose_url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
docker_compose_checksum: "sha256:db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576"
docker_compose_path: /usr/local/lib/docker/cli-plugins/docker-compose