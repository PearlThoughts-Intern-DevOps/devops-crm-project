name: CI Improvements

# Runs on every PR open/update, same trigger surface as the existing ci.yml,
# but as an independent, from-scratch pipeline so it can be reviewed and
# compared side-by-side without touching the original workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege by default at the workflow level; individual jobs only
# escalate where a specific action genuinely needs it.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch to save CI minutes and avoid
# confusing out-of-order status checks.
concurrency:
  group: ci-improvements-${{ github.ref }}
  cancel-in-progress: true

env:
  TWENTY_VERSION: latest

jobs:
  # ---------------------------------------------------------------------
  # Install once. Every job below installs independently (fast on a warm
  # Yarn cache via setup-node's cache: yarn) rather than handing a
  # node_modules folder between jobs, which is linker-mode-dependent and
  # fragile across separate runners. IMPORTANT: Corepack must be enabled
  # BEFORE actions/setup-node runs, because setup-node's cache: yarn
  # option immediately shells out to `yarn --version` to compute the
  # cache key -- if Corepack hasn't swapped in this project's pinned
  # Yarn 4 yet, it finds Ubuntu's stock Yarn 1.22.22 and fails on the
  # packageManager mismatch.
  # ---------------------------------------------------------------------
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

  # ---------------------------------------------------------------------
  # Fast, independent checks run in parallel instead of one serial job,
  # so a lint failure is visible immediately instead of waiting behind
  # typecheck/tests.
  # ---------------------------------------------------------------------
  lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      # Also acts as our "build validation" step: this project has no
      # separate build artifact (it's synced live via the Twenty CLI), so
      # a clean TypeScript typecheck is the closest equivalent to "the
      # application builds successfully".
      - name: Typecheck (build validation)
        run: yarn typecheck

  unit-test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Unit tests
        run: yarn test:unit

  # ---------------------------------------------------------------------
  # Integration tests need a live spawned Twenty instance, which has been
  # observed to intermittently fail app-sync with a data-consistency error
  # unrelated to any single PR's code changes. We isolate this into its
  # own job (so it never blocks lint/typecheck/unit results) and retry the
  # sync step a bounded number of times before treating it as a genuine
  # failure — retries handle transient flakiness without masking a real,
  # persistent break.
  # ---------------------------------------------------------------------
  integration-test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: ${{ env.TWENTY_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run integration tests (with retry for known sync flakiness)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      # If it still fails after retries, capture logs so a human doesn't
      # have to reproduce the failure locally from scratch.
      - name: Upload Twenty server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twenty-server-logs
          path: |
            **/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Security: scan dependency changes introduced by this PR for known
  # vulnerabilities before merge.
  #
  # NOTE: this requires "Dependency graph" to be enabled in the
  # repository's Settings > Security page, which only a repo/org admin
  # can toggle -- it cannot be enabled from a workflow file. If that
  # setting is off, this job fails immediately with "Dependency review
  # is not supported on this repository", regardless of the PR's actual
  # dependency changes. We mark it continue-on-error so that an
  # org-level setting outside a contributor's control doesn't block
  # every PR's overall CI status, and exclude it from the required
  # ci-summary check accordingly. Once Dependency graph is enabled for
  # this repo, remove continue-on-error to make it enforcing.
  # ---------------------------------------------------------------------
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # ---------------------------------------------------------------------
  # A single required status check summarising the enforcing jobs above,
  # so branch protection can require just this one check. dependency-review
  # is intentionally excluded from the failure condition -- see the note
  # on that job -- but its result is still logged for visibility.
  # ---------------------------------------------------------------------
  ci-summary:
    if: always()
    needs: [lint, typecheck, unit-test, integration-test, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "unit-test: ${{ needs.unit-test.result }}"
          echo "integration-test: ${{ needs.integration-test.result }}"
          echo "dependency-review (advisory, not blocking): ${{ needs.dependency-review.result }}"

          FAILED=false
          for job_result in "${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.unit-test.result }}" "${{ needs.integration-test.result }}"; do
            if [[ "$job_result" == "failure" ]]; then
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi