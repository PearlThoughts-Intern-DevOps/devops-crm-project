name: CI Improvements

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-improvements-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TWENTY_VERSION: latest

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Security audit
        run: yarn npm audit --all --recursive --severity high

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for integration tests
        shell: bash
        run: |
          if find src -type f -name "*.integration-test.ts" -print -quit | grep -q .; then
            echo "Integration tests exist, but no integration environment is configured for this repository."
            echo "Please configure the required Twenty test environment before enabling them."
            exit 1
          else
            echo "No integration test files found; integration testing is skipped."
          fi

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build application
        run: yarn twenty dev:build

  ci-status:
    name: CI Status
    if: always()
    needs: [quality, integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ||
                "${{ needs.integration.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
