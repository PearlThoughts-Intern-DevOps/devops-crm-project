name: CI Improvements

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-improvements-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TWENTY_VERSION: "2.35.0"

jobs:
  ci:
    name: Lint, Typecheck, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Verify tool versions
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@c9153c49220462b280a56bdba20f3e96ce0bd299
        with:
          twenty-version: ${{ env.TWENTY_VERSION }}

      - name: Integration tests
        run: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      - name: Build application
        run: yarn twenty dev:build

      - name: Security audit
        run: yarn npm audit --all --recursive --severity high
