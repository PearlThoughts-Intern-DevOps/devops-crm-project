name: CI Improvements

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-improvements-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TWENTY_VERSION: latest

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Security audit
        run: yarn npm audit --all --recursive --severity high

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect integration tests
        id: detect
        shell: bash
        run: |
          if find src -type f -name "*.integration-test.ts" -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Integration tests found."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No integration test files found; skipping integration tests."
          fi

      - name: Enable Corepack
        if: steps.detect.outputs.found == "true"
        run: corepack enable

      - name: Setup Node.js
        if: steps.detect.outputs.found == "true"
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        if: steps.detect.outputs.found == "true"
        run: yarn install --immutable

      - name: Spawn Twenty test instance
        if: steps.detect.outputs.found == "true"
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: ${{ env.TWENTY_VERSION }}

      - name: Run integration tests
        if: steps.detect.outputs.found == "true"
        run: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      - name: Report skipped integration tests
        if: steps.detect.outputs.found != "true"
        run: echo "No integration test files exist; integration stage skipped."

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build application
        run: yarn twenty dev:build

  ci-status:
    name: CI Status
    if: always()
    needs: [quality, integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ||
                "${{ needs.integration.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
