name: CI Improvements

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-improvements-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TWENTY_VERSION: latest

jobs:
  ci:
    name: Validate Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # --------------------------------------------------
      # 3. Enable Corepack
      # --------------------------------------------------
      - name: Enable Corepack
        run: corepack enable

      # --------------------------------------------------
      # 4. Activate project Yarn version
      # --------------------------------------------------
      - name: Setup Yarn
        run: |
          corepack install
          yarn --version

      # --------------------------------------------------
      # 5. Cache Yarn dependencies
      # --------------------------------------------------
      - name: Get Yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # --------------------------------------------------
      # 6. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: yarn install --immutable

      # --------------------------------------------------
      # 7. Lint
      # --------------------------------------------------
      - name: Run lint
        run: yarn lint

      # --------------------------------------------------
      # 8. Typecheck
      # --------------------------------------------------
      - name: Run typecheck
        run: yarn typecheck

      # --------------------------------------------------
      # 9. Unit tests
      # --------------------------------------------------
      - name: Run unit tests
        run: yarn test:unit

      # --------------------------------------------------
      # 10. Security audit
      # --------------------------------------------------
      - name: Run security audit
        run: yarn npm audit --severity high --recursive

      # --------------------------------------------------
      # 11. Spawn Twenty test instance
      # --------------------------------------------------
      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: ${{ env.TWENTY_VERSION }}

      # --------------------------------------------------
      # 12. Integration tests
      # --------------------------------------------------
      - name: Run integration tests
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}
        run: yarn test

      # --------------------------------------------------
      # 13. Build validation
      # --------------------------------------------------
      - name: Build application
        run: yarn twenty dev:build

      # --------------------------------------------------
      # 14. Final summary
      # --------------------------------------------------
      - name: CI summary
        if: success()
        run: |
          echo "======================================"
          echo "Improved CI completed successfully"
          echo "======================================"
          echo "Dependencies : PASSED"
          echo "Lint         : PASSED"
          echo "Typecheck    : PASSED"
          echo "Unit tests   : PASSED"
          echo "Security     : PASSED"
          echo "Integration  : PASSED"
          echo "Build        : PASSED"