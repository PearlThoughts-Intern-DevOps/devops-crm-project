name: CI Improvements

on:
  push:
    branches:
      - saketh-task-6
    
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-improvements-${{ github.ref }}
  cancel-in-progress: true

env:
  TWENTY_VERSION: latest

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

  lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - name: Lint
        run: yarn lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck

  unit-tests:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - name: Unit tests
        run: yarn test:unit

  integration-tests:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: ${{ env.TWENTY_VERSION }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - name: Integration tests
        run: yarn test --passWithNoTests
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

  build:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - name: Build application
        run: yarn twenty dev:build

  ci-status:
    if: always()
    needs: [lint, typecheck, unit-tests, integration-tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
