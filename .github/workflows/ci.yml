name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ci:
    name: Lint, Test and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run linting
        run: yarn lint

      - name: Run type checking
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test:unit

      - name: Run tests
        run: yarn test
