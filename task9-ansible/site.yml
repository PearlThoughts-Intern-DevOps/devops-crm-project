---
- name: Deploy Twenty CRM
  hosts: twenty
  become: true

  vars:
    app_user: twenty
    app_dir: /opt/twenty
    server_url: http://localhost:3000
    encryption_key: "playground-encryption-key-123456789"
    postgres_password: "twenty-postgres-password"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /bin/bash
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Clone Twenty CRM
      ansible.builtin.git:
        repo: https://github.com/twentyhq/twenty.git
        dest: "{{ app_dir }}/twenty"
        version: main
        update: true

    - name: Create compose directory
      ansible.builtin.file:
        path: "{{ app_dir }}/compose"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: "{{ app_dir }}/twenty/packages/twenty-docker/docker-compose.yml"
        dest: "{{ app_dir }}/compose/docker-compose.yml"
        remote_src: true
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      notify: Restart Twenty

    - name: Configure environment with Jinja2
      ansible.builtin.template:
        src: templates/twenty.env.j2
        dest: "{{ app_dir }}/compose/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      notify: Restart Twenty

    - name: Start Twenty CRM
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}/compose"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

    - name: Verify Twenty CRM
      ansible.builtin.uri:
        url: "{{ server_url }}"
        status_code: 200
      register: twenty_status
      retries: 20
      delay: 5
      until: twenty_status.status == 200

  handlers:
    - name: Restart Twenty
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}/compose"
