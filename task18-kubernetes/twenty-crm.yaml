apiVersion: v1
kind: Service
metadata:
  name: postgres-task18
spec:
  selector:
    app: postgres-task18
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-task18
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-task18
  template:
    metadata:
      labels:
        app: postgres-task18
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: twenty
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: redis-task18
spec:
  selector:
    app: redis-task18
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-task18
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-task18
  template:
    metadata:
      labels:
        app: redis-task18
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-crm-task18
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-crm-task18
  template:
    metadata:
      labels:
        app: twenty-crm-task18
    spec:
      containers:
        - name: twenty-crm
          image: twentycrm/twenty:latest
          env:
            - name: ENCRYPTION_KEY
              value: "task18-local-encryption-key-2026-very-long"
            - name: PG_DATABASE_URL
              value: "postgresql://postgres:postgres@postgres-task18:5432/twenty"
            - name: REDIS_URL
              value: "redis://redis-task18:6379"
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: twenty-crm-task18-service
spec:
  type: NodePort
  selector:
    app: twenty-crm-task18
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
